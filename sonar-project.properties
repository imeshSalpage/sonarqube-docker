# Project identification
sonar.projectKey=your-project-key
sonar.projectName=Your Project Name
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Exclusions (customize based on your project structure)
sonar.exclusions=**/vendor/**,**/node_modules/**,**/build/**,**/dist/**

# Language specific settings (uncomment and configure as needed)
# sonar.language=php
# sonar.php.coverage.reportPaths=coverage.xml
# sonar.php.tests.reportPath=test-report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server
sonar.host.url=http://localhost:9000

# Authentication - Generate token at http://your-sonarqube-url:port/account/security
# Replace YOUR_TOKEN_HERE with the actual token from SonarQube
sonar.token=YOUR_TOKEN_HERE
